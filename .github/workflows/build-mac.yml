name: Build macOS Executables

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x86_64, arm64]
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        
    - name: Build with PyInstaller (Mac ${{ matrix.arch }})
      run: |
        pyinstaller -F --target-arch ${{ matrix.arch }} Antigravity-Patcher.py
        pyinstaller -F --target-arch ${{ matrix.arch }} Restore.py
        
    - name: Rename binaries
      run: |
        mv dist/Antigravity-Patcher dist/Antigravity-Patcher-macOS-${{ matrix.arch }}
        mv dist/Restore dist/Restore-macOS-${{ matrix.arch }}
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: macos-${{ matrix.arch }}-binaries
        path: |
          dist/Antigravity-Patcher-macOS-${{ matrix.arch }}
          dist/Restore-macOS-${{ matrix.arch }}
